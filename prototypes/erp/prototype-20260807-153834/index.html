            activeFormMode = "create";
            setTimeout(function () {
              scheduleSync();
            }, 160);
          }
          if (label === "编辑" && !actionNode.closest(".discount-redesign-form") && !actionNode.closest(".discount-redesign-detail")) {
            event.preventDefault();
            event.stopPropagation();
            activeFormMode = "edit";
            ensureFormRedesign("edit");
            scheduleSync();
          }
        });
        window.addEventListener("load", scheduleSync);
        scheduleSync();
      })();
    </script>
  </body>
</html>
