    .stat .num{font-size:24px;font-weight:700;line-height:1.2}

    .search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.12)}

    .btn:hover{border-color:var(--blue);color:var(--blue)}
    .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn-primary:hover{background:#0958d9;color:#fff}

    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;cursor:pointer;transition:.15s}
    .tab:hover{border-color:var(--blue);color:var(--blue)}
    .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

    .sec-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
    .sec-title h2{margin:0;font-size:18px;border-left:4px solid var(--blue);padding-left:10px}
    .sec-title .count{font-size:13px;color:var(--muted)}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(16,24,40,.03);display:flex;flex-direction:column;justify-content:space-between;transition:.15s}

    .card.featured{border-left:4px solid var(--blue)}

    .t-star{background:#e6f4ff;color:#0958d9;border-color:#91caff;font-weight:600}
    .t-prd{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}

    .meta-txt{font-size:12px;color:var(--muted)}

</head>

          <p>统一归档 ERP、售后、BI、财务系统等全部 PRD 需求文档与交互原型，支持一键检索、分类查看与 Markdown 清单导出，方便持续复盘与阶段总结。</p>

            <option value="updated_desc">按更新时间倒序</option>
            <option value="created_desc">按创建时间倒序</option>

        </div>

        </div>
      </div>

    const CATS = ["全部", "⭐ 本期重点需求", "ERP & 订单", "售后", "BI & 财务", "其他"];
    let activeCat = "全部";

    const $ = (id) => document.getElementById(id);

    function statusClass(st) {
      if (st === "已完成") return "t-st-done";
      if (st === "开发中" || st === "待测试" || st === "已评审") return "t-st-dev";
      if (st === "待评审" || st === "待开发") return "t-st-wait";
      return "t-st-gray";
    }

    function updateStats() {
      $("sTotal").textContent = ITEMS.length;
      $("sFeatured").textContent = ITEMS.filter(i => i.featured).length;
      $("sPrd").textContent = ITEMS.filter(i => i.type.includes("PRD")).length;
      $("sProto").textContent = ITEMS.filter(i => i.type.includes("原型") || i.status === "历史归档").length;
    }

    function renderTabs() {
      const box = $("catTabs");
      box.innerHTML = "";
      CATS.forEach(c => {
        const count = c === "全部"
          ? ITEMS.length
          : c === "⭐ 本期重点需求"
            ? ITEMS.filter(i => i.featured).length
            : ITEMS.filter(i => i.category === c).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (activeCat === c ? " active" : "");
        btn.textContent = `${c} (${count})`;
        btn.onclick = () => { activeCat = c; renderTabs(); renderList(); };
        box.appendChild(btn);
      });
    }

    function getFiltered() {
      const q = $("q").value.trim().toLowerCase();
      const st = $("statusFilter").value;
      const sort = $("sortBy").value;

      let list = ITEMS.filter(i => {
        if (activeCat === "⭐ 本期重点需求" && !i.featured) return false;
        if (activeCat !== "全部" && activeCat !== "⭐ 本期重点需求" && i.category !== activeCat) return false;
        if (st !== "ALL" && i.status !== st) return false;
        if (q) {
          const hay = [i.title, i.code || "", i.businessSystem, i.category, i.type, i.status, i.summary].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (sort === "featured_updated") {
          const fa = a.featured ? 1 : 0, fb = b.featured ? 1 : 0;
          if (fa !== fb) return fb - fa;
          return (b.updatedAt || "").localeCompare(a.updatedAt || "");
        }
        if (sort === "created_desc") return (b.createdAt || "").localeCompare(a.createdAt || "");
        return (b.updatedAt || "").localeCompare(a.updatedAt || "");
      });
      return list;
    }

    function renderList() {
      const list = getFiltered();
      $("listHeading").textContent = activeCat === "全部" ? "全部需求与原型" : activeCat;
      $("resultCount").textContent = `共 ${list.length} 项`;
      const grid = $("grid");
      const empty = $("empty");

      if (!list.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      grid.innerHTML = list.map(i => `
        <article class="card ${i.featured ? "featured" : ""}">
          <div>
            <div class="badges">
              ${i.featured ? '<span class="tag t-star">本期重点</span>' : ""}
              <span class="tag ${i.type.includes("PRD") ? "t-prd" : "t-proto"}">${i.type}</span>
              <span class="tag ${statusClass(i.status)}">${i.status}</span>
              ${i.code ? `<span class="code-id">${i.code}</span>` : ""}
            </div>
            <h3><a href="${i.url}">${i.title}</a></h3>
            <p class="desc">${i.summary}</p>
          </div>
          <div class="card-foot">
            <div class="meta-txt">${i.businessSystem} · 更新 ${i.updatedAt}</div>
            <div class="actions">
              <a class="a-btn primary" href="${i.url}">${i.type === "交互原型" ? "打开原型" : "查看文档"}</a>
              ${i.extraUrl ? `<a class="a-btn" href="${i.extraUrl}" target="_blank" rel="noopener">${i.extraLabel || "关联链接"} ↗</a>` : ""}
              ${i.yunxiaoUrl ? `<a class="a-btn" href="${i.yunxiaoUrl}" target="_blank" rel="noopener">云效 ↗</a>` : ""}
            </div>
          </div>
        </article>
      `).join("");
    }

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    $("exportMd").onclick = () => {
      const base = location.href.replace(/index\.html.*$/, "").replace(/#.*$/, "");
      const list = getFiltered();
      const lines = [
        "| 序号 | 编号 | 需求 / 原型标题 | 模块 | 类型 | 状态 | 更新时间 | 链接 |",
        "|---|---|---|---|---|---|---|---|"
      ];
      list.forEach((i, idx) => {
        const fullUrl = i.url.startsWith("http") ? i.url : new URL(i.url, base).href;
        lines.push(`| ${idx + 1} | ${i.code || "-"} | ${i.title} | ${i.businessSystem} | ${i.type} | ${i.status} | ${i.updatedAt} | [查看](${fullUrl}) |`);
      });
      navigator.clipboard.writeText(lines.join("\n")).then(
        () => showToast(`已复制 ${list.length} 条记录的 Markdown 汇总表`),
        () => showToast("复制失败，请手动在浏览器允许剪贴板权限")
      );
    };

    $("q").addEventListener("input", renderList);
    $("statusFilter").addEventListener("change", renderList);
    $("sortBy").addEventListener("change", renderList);

    updateStats();
    renderTabs();
    renderList();
  </script>
